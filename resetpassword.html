<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - StreamFlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="padding-top: 70px;">
  <nav style="background-color: var(--bg-primary)" class="navbar navbar-expand-lg fixed-top py-2">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        Stream<span style="color: var(--brand-purple)">Flex</span>
      </a>
    </div>
  </nav>
  <main class="d-flex align-items-center justify-content-center flex-grow-1 p-3">
    <div class="form-container">
      <div class="text-center mb-5">
        <h1 class="h3 fw-bold" style="letter-spacing: 1px;">StreamFlex</h1>
        <h2 class="h5 mt-3 fw-normal text-secondary">Reset Your Password</h2>
        <p class="text-tertiary mt-3">Enter your email address and we will send you a link to reset your password.</p>
      </div> 
      <form>
        <div class="mb-4">
          <label for="email" class="form-label visually-hidden">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email address" required>
        </div>
        <button class="btn btn-primary w-100 py-2 my-3" type="submit">Send Reset Link</button>
      </form>
      <p class="mt-4 text-center text-secondary">
        Remember your password? <a href="login.html" class="auth-link">Log In</a>
      </p>
    </div>
  </main>

</body>
</html>
