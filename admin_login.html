<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - StreamFlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="padding-top: 70px;">
  <nav style="background-color: var(--bg-primary)" class="navbar navbar-expand-lg fixed-top py-2">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        Stream<span style="color: var(--brand-purple)">Flex</span>
      </a>
    </div>
  </nav>
  <main class="d-flex align-items-center justify-content-center flex-grow-1 p-3">
    <div class="form-container">
      <div class="text-center mb-5">
        <h1 class="h3 fw-bold" style="letter-spacing: 1px;">StreamFlex</h1>
        <h2 class="h5 mt-3 fw-normal text-secondary">Administrator Access</h2>
      </div>
      
      <form>
        <div class="mb-3">
          <label for="email" class="form-label visually-hidden">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Administrator Email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label visually-hidden">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>
        <div class="mb-4">
          <label for="passphrase" class="form-label visually-hidden">Passphrase</label>
          <input type="password" class="form-control" id="passphrase" name="passphrase" placeholder="Security Passphrase" required>
        </div>
        <button class="btn btn-primary w-100 py-2 my-3" type="submit">Authenticate</button>
      </form>
      <p class="mt-4 text-center text-secondary">
        Not an admin? <a href="login.html" class="auth-link">Login as User</a>
      </p>
    </div>
  </main>

</body>
</html>
