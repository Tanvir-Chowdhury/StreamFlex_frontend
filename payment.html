<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - StreamFlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/payment.css">
</head>
<body style="padding-top: 70px;">
  <nav style="background-color: var(--bg-primary)" class="navbar navbar-expand-lg fixed-top py-2">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        Stream<span style="color: var(--brand-purple)">Flex</span>
      </a>
    </div>
  </nav>
  <main class="container my-5">
    <div class="row g-5">
      <div class="col-lg-7">
        <h1 class="h2 mb-4 fw-bold">Complete your payment</h1>
        <ul class="nav nav-pills payment-methods mb-4" id="payment-tab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="card-tab" data-bs-toggle="tab" data-bs-target="#card-payment" type="button" role="tab" aria-controls="card-payment" aria-selected="true">
              <i class="bi bi-credit-card-fill me-2"></i> Card
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="bkash-tab" data-bs-toggle="tab" data-bs-target="#bkash-payment" type="button" role="tab" aria-controls="bkash-payment" aria-selected="false">
              <img src="https://cdn.worldvectorlogo.com/logos/bkash-logo-2023.svg" alt="bKash Logo" class="payment-logo">
              bKash
            </button>
          </li>
        </ul>
        <div class="payment-form">
          <div class="tab-content" id="payment-tab-content">
            <div class="tab-pane fade show active" id="card-payment" role="tabpanel" aria-labelledby="card-tab">
              <form>
                <div class="mb-3">
                  <label for="cardName" class="form-label">Name on Card</label>
                  <input type="text" class="form-control" id="cardName" required>
                </div>
                <div class="mb-3">
                  <label for="cardNumber" class="form-label">Card Number</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="cardNumber" placeholder="0000 0000 0000 0000" required>
                    <span class="input-group-text" style="background-color: var(--bg-tertiary); border-color: var(--bg-tertiary);">
                      <svg class="card-logos" width="38" height="24" viewBox="0 0 38 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pi-visa"><title id="pi-visa">Visa</title><path fill="#0166AF" d="M22.9 17.2h-2.3c-.5 0-.8-.2-1-.7l-3.2-8.3h2.3c.5 0 .8.2 1 .7l2.2 6.3 1.1-6.3c.1-.4.4-.6.8-.6h2.2l-1.9 8.3c-.2.6-.5.8-1.2.8zM12.9 17.2H9.8c-.6 0-.9-.3-1-.8l-1.9-8.2h2.3c.5 0 .8.2 1 .7l1.1 6.3 2.1-6.3c.1-.4.4-.6.8-.6h2.2l-3.3 8.3c-.3.5-.6.7-1.2.7zM35 17.2c-.6 0-.9-.3-1-.8l-1.9-8.2h2.3c.5 0 .8.2 1 .7l1.1 6.3 2.1-6.3c.1-.4.4-.6.8-.6h2.2l-3.3 8.3c-.3.5-.6.7-1.2.7h-3.1zM29.9 8.9h-2.2c-.5 0-.8.2-1 .7l-3.2 8.3h2.3c.5 0 .8.2 1 .7l2.2 6.3 1.1-6.3c.1-.4.4-.6.8-.6h2.2l-1.9 8.3c-.2.6-.5.8-1.2.8z"/></svg>
                      <svg class="card-logos ms-2" width="38" height="24" viewBox="0 0 38 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pi-mastercard"><title id="pi-mastercard">Mastercard</title><circle fill="#EB001B" cx="15" cy="12" r="7"/><circle fill="#F79E1B" cx="23" cy="12" r="7"/><path fill="#FF5F00" d="M22 12c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8 8 3.6 8 8z"/></svg>
                    </span>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="cardExpiry" class="form-label">Expiry Date</label>
                    <input type="text" class="form-control" id="cardExpiry" placeholder="MM / YY" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="cardCvv" class="form-label">CVV</label>
                    <input type="text" class="form-control" id="cardCvv" placeholder="123" required>
                  </div>
                </div>
              </form>
            </div>
            <div class="tab-pane fade" id="bkash-payment" role="tabpanel" aria-labelledby="bkash-tab">
              <p class="text-secondary">You will be prompted to enter your PIN on your mobile phone to complete the payment.</p>
              <form>
                <div class="mb-3">
                  <label for="bkashNumber" class="form-label">Your bKash Account Number</label>
                  <input type="text" class="form-control" id="bkashNumber" placeholder="01..." required>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="order-summary-card">
          <h2 class="summary-title">Order Summary</h2>
          <div class="summary-item">
            <span>Subtotal</span>
            <span id="summary-subtotal">BDT 0.00</span>
          </div>
          <div class="summary-item">
            <span>Taxes & Fees (1.5%)</span>
            <span id="summary-taxes">BDT 0.00</span>
          </div>
          <hr style="border-color: var(--bg-tertiary);">
          <div class="summary-item summary-total">
            <span>Total</span>
            <span id="summary-total">BDT 0.00</span>
          </div>
          <div class="d-grid mt-4">
            <button id="pay-now-btn" class="btn btn-primary btn-lg">Pay BDT 0.00</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const MOCK_SUBTOTAL = 1700.00; 
    const TAX_RATE = 0.015;

    const subtotalEl = document.getElementById('summary-subtotal');
    const taxesEl = document.getElementById('summary-taxes');
    const totalEl = document.getElementById('summary-total');
    const payNowBtn = document.getElementById('pay-now-btn');


    function calculateAndDisplayTotal() {
      const taxes = MOCK_SUBTOTAL * TAX_RATE;
      const total = MOCK_SUBTOTAL + taxes;

      subtotalEl.textContent = `BDT ${MOCK_SUBTOTAL.toFixed(2)}`;
      taxesEl.textContent = `BDT ${taxes.toFixed(2)}`;
      totalEl.textContent = `BDT ${total.toFixed(2)}`;
      payNowBtn.textContent = `Pay BDT ${total.toFixed(2)}`;
    }
    document.addEventListener('DOMContentLoaded', () => {
      calculateAndDisplayTotal();
    });
  </script>

</body>
</html>
