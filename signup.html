<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - StreamFlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="padding-top: 70px;">
  <nav style="background-color: var(--bg-primary)" class="navbar navbar-expand-lg fixed-top py-2">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        Stream<span style="color: var(--brand-purple)">Flex</span>
      </a>
    </div>
  </nav>
  <main class="d-flex align-items-center justify-content-center flex-grow-1 p-3">
    <div class="form-container">
      <div class="text-center mb-5">
        <h1 class="h3 fw-bold" style="letter-spacing: 1px;">StreamFlex</h1>
        <h2 class="h5 mt-3 fw-normal text-secondary">Create your Account</h2>
      </div>
      <form>
        <div class="btn-group w-100 mb-3" role="group" aria-label="Registration type">
          <button type="button" class="btn active" id="btn-email">Email</button>
          <button type="button" class="btn" id="btn-phone">Phone</button>
        </div>
        <div class="mb-3">
          <label for="reg-input" class="form-label visually-hidden">Email or Phone</label>
          <input type="email" class="form-control" id="reg-input" name="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label visually-hidden">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>
        <button class="btn btn-primary w-100 py-2 my-3" type="submit">Sign Up</button>
      </form> 
      <div class="d-flex align-items-center my-3">
        <hr class="flex-grow-1 divider">
        <span class="px-3 fs-sm text-tertiary">OR</span>
        <hr class="flex-grow-1 divider">
      </div>
      <button class="btn btn-outline-light w-100 py-2" type="button">
          <i class="bi bi-google me-2"></i> Sign up with Google
      </button> 
      <p class="mt-4 text-center text-secondary">
        Already have an account? <a href="login.html" class="auth-link">Log In</a>
      </p>
    </div>
  </main>

  <script>
    const btnEmail = document.getElementById('btn-email');
    const btnPhone = document.getElementById('btn-phone');
    const regInput = document.getElementById('reg-input');

    btnEmail.addEventListener('click', () => {
      btnEmail.classList.add('active');
      btnPhone.classList.remove('active');
      regInput.type = 'email';
      regInput.placeholder = 'you@example.com';
      regInput.value = '';
      regInput.pattern = '';
      regInput.name = 'email';
    });

    btnPhone.addEventListener('click', () => {
      btnPhone.classList.add('active');
      btnEmail.classList.remove('active');
      regInput.type = 'tel';
      regInput.placeholder = '+880 1...';
      regInput.value = '+880';
      regInput.pattern = '\\+880[0-9]{10}'; 
      regInput.name = 'phone';
    });
  </script>

</body>
</html>
