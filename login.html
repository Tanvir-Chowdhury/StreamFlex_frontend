<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StreamFlex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="padding-top: 70px;">
  <nav style="background-color: var(--bg-primary)" class="navbar navbar-expand-lg fixed-top py-2">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        Stream<span style="color: var(--brand-purple)">Flex</span>
      </a>
      <div class="d-flex align-items-center">
        <a href="admin_login.html" class="nav-link text-secondary me-3 d-flex align-items-center">
          <i class="bi bi-person-fill-gear me-1"></i>
          <span>Admin</span>
        </a>
      </div>
    </div>
  </nav>
  <main class="d-flex align-items-center justify-content-center flex-grow-1 p-3">
    <div class="form-container">
      <div class="text-center mb-5">
        <h1 class="h3 fw-bold" style="letter-spacing: 1px;">StreamFlex</h1>
        <h2 class="h5 mt-3 fw-normal text-secondary">Welcome Back</h2>
      </div>
      <form>
        <div class="mb-3">
          <label for="login-id" class="form-label visually-hidden">Email or Phone</label>
          <input type="text" class="form-control" id="login-id" name="login-id" placeholder="Email or Phone Number" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label visually-hidden">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>
        <div class="d-flex justify-content-end mb-3">
            <a href="resetpassword.html" class="auth-link" style="font-size: 0.9rem;">Forgot Password?</a>
        </div>
        <button class="btn btn-primary w-100 py-2 my-3" type="submit">Log In</button>
      </form>
      <div class="d-flex align-items-center my-3">
        <hr class="flex-grow-1 divider">
        <span class="px-3 fs-sm text-tertiary">OR</span>
        <hr class="flex-grow-1 divider">
      </div>
      <button class="btn btn-outline-light w-100 py-2" type="button">
          <i class="bi bi-google me-2"></i> Sign in with Google
      </button>
      <p class="mt-4 text-center text-secondary">
        New to StreamFlex? <a href="signup.html" class="auth-link">Sign Up Now</a>
      </p>
    </div>
  </main>
</body>
</html>
